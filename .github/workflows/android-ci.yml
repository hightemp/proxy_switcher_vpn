name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Cache libbox artifact
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/proxy-switcher-vpn/libbox
          key: ${{ runner.os }}-libbox-${{ hashFiles('gradle/libbox.properties') }}

      - name: Verify libbox artifact
        run: ./gradlew verifyLibboxArtifact

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
